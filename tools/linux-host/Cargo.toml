[package]
name = "counterpart-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Linux setup, user service and credential-resolving model worker for the Counterpart companion"
publish = false

[[bin]]
name = "counterpart-host"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Pure-Rust session encryption: no OpenSSL link, one static helper.
# Same zbus as secret-service, only to classify its D-Bus errors.
zbus = { version = "5", default-features = false, features = ["async-io"] }
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
