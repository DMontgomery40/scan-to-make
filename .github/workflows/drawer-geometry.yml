name: Drawer geometry checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/templates/drawer-organizer/**'
      - 'packages/contracts/**'
      - '.github/workflows/drawer-geometry.yml'
  push:
    branches: [main]
    paths:
      - 'tools/templates/drawer-organizer/**'
      - 'packages/contracts/**'
      - '.github/workflows/drawer-geometry.yml'
permissions:
  contents: read
jobs:
  drawer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run drawer geometry tests
        run: python3 -m unittest discover -s tools/templates/drawer-organizer/tests -v
      - name: Regenerate and verify committed fixture artifacts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          template = root / 'tools/templates/drawer-organizer'
          fixture = root / 'packages/contracts/fixtures/drawer-tray.json'
          with tempfile.TemporaryDirectory(prefix='drawer-ci-') as directory:
              subprocess.run([
                  sys.executable, str(template / 'drawer.py'), 'generate',
                  '--spec', str(fixture), '--out-dir', directory,
              ], check=True)
              output = Path(directory)
              for name in ('drawer-tray.stl', 'drawer-tray.manifest.json'):
                  assert (output / name).read_bytes() == (template / 'examples' / name).read_bytes(), f'Fixture drift: {name}'
              stl = (output / 'drawer-tray.stl').read_bytes()
              artifact = json.loads((output / 'drawer-tray.manifest.json').read_text())['artifact']
              assert artifact['mediaType'] == 'model/stl'
              assert artifact['byteLength'] == len(stl), 'Manifest length mismatch'
              assert artifact['sha256'] == hashlib.sha256(stl).hexdigest(), 'Manifest digest mismatch'
              print(f"Verified {len(stl)} STL bytes, SHA256 {artifact['sha256']}")
          PY
