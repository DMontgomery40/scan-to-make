name: Scan correction checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/scan-correct/**'
      - '.github/workflows/scan-correct.yml'
  push:
    branches: [main]
    paths:
      - 'tools/scan-correct/**'
      - '.github/workflows/scan-correct.yml'
permissions:
  contents: read
jobs:
  scan-correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Locate pinned Blender
        run: echo "BLENDER=${{ runner.temp }}/blender/blender-5.0.1-linux-x64/blender" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: blender-cache
        with:
          path: ${{ runner.temp }}/blender
          key: blender-5.0.1-linux-x64-8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
      - name: Download and verify Blender against published checksums
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blender"
          cd "${{ runner.temp }}/blender"
          base=https://download.blender.org/release/Blender5.0
          curl --fail --location --retry 3 "$base/blender-5.0.1.sha256" -o checksums.txt
          curl --fail --location --retry 3 "$base/blender-5.0.1-linux-x64.tar.xz" -o blender-5.0.1-linux-x64.tar.xz
          awk '$2 == "blender-5.0.1-linux-x64.tar.xz" {print}' checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          test "$(cut -d ' ' -f 1 selected.sha256)" = 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
          sha256sum --check selected.sha256
          tar -xf blender-5.0.1-linux-x64.tar.xz
          rm blender-5.0.1-linux-x64.tar.xz
      - name: Install headless graphics and unprivileged seccomp runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 xvfb xauth libseccomp2
      - name: Install exact converter bridge test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/capture-mesh-convert/requirements.txt
      - name: Check actual IPv4 and IPv6 denial as the ordinary runner user
        # libseccomp loads a no_new_privs filter; no sudo, namespaces or elevated caps.
        # Failure is fatal. Never skip or disable the production sandbox in CI.
        run: python -m unittest discover -s tools/scan-correct/tests -p test_service.py -k network_sandbox -v
      - name: Verify pinned runtime and compile
        run: |
          "$BLENDER" --version
          test -x "$BLENDER"
          python -c 'from pxr import Usd; from PIL import Image; print(Usd.GetVersion(), Image.__version__)'
          python -m py_compile tools/scan-correct/*.py tools/scan-correct/tests/*.py
      - name: Run all synthetic Blender and adapter tests (no skips)
        run: |
          xvfb-run -a python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/scan-correct/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('Unexpected CI skips: Blender and converter dependencies must be available.', file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
