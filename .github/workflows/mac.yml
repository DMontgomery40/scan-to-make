name: Mac app
on:
  push:
    branches: [main]
    paths: ['apps/mac/**', 'services/companion/src/local-control*', 'services/companion/src/model-access*', 'services/companion/src/printer-*', 'packages/contracts/src/printer-setup.ts', 'packages/contracts/fixtures/printer-setup*.json', 'packages/contracts/src/model-access.ts', 'packages/contracts/fixtures/model-access*.json', '.github/workflows/mac.yml']
  pull_request:
    paths: ['apps/mac/**', 'services/companion/src/local-control*', 'services/companion/src/model-access*', 'services/companion/src/printer-*', 'packages/contracts/src/printer-setup.ts', 'packages/contracts/fixtures/printer-setup*.json', 'packages/contracts/src/model-access.ts', 'packages/contracts/fixtures/model-access*.json', '.github/workflows/mac.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: swift test --package-path apps/mac
      - name: ControlKit tests
        run: swift test --package-path apps/mac/ControlKit
      - name: Companion runtime configuration tests
        run: node --test apps/mac/Tests/runtime.test.mjs
      - name: Build shell without signing or runtime downloads
        run: xcodebuild -project apps/mac/ScanToMake.xcodeproj -scheme ScanToMake -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath "${{ runner.temp }}/mac-build" CODE_SIGNING_ALLOWED=NO build
      - name: Compiled model worker boundary tests
        run: STM_MAC_BUILT_APP="${{ runner.temp }}/mac-build/Build/Products/Debug/Scan to Make.app" node --test apps/mac/Tests/model-worker.test.mjs
