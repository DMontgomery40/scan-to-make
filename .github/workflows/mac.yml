name: Mac app
on:
  push:
    branches: [main]
    paths: ['apps/mac/**', 'services/companion/src/local-control*', 'services/companion/src/model-access*', 'packages/contracts/src/model-access.ts', 'packages/contracts/fixtures/model-access*.json', '.github/workflows/mac.yml']
  pull_request:
    paths: ['apps/mac/**', 'services/companion/src/local-control*', 'services/companion/src/model-access*', 'packages/contracts/src/model-access.ts', 'packages/contracts/fixtures/model-access*.json', '.github/workflows/mac.yml']
permissions:
  contents: read
jobs:
  build:
    # The app targets macOS 27 (Liquid Glass and the macOS 27 scene APIs): GitHub's macOS 27 image with Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27.2
        # The hosted image keeps it at Xcode_27.2.app; a Mac running the local gate already has it selected.
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; fi
          case "$(xcodebuild -version)" in "Xcode 27.2"*) ;; *) echo "Xcode 27.2 is required"; exit 1 ;; esac
      - name: Unit tests
        run: swift test --package-path apps/mac
      - name: ControlKit tests
        run: swift test --package-path apps/mac/ControlKit
      - name: Companion runtime configuration tests
        run: node --test apps/mac/Tests/runtime.test.mjs
      - name: Build shell without signing or runtime downloads
        run: xcodebuild -project apps/mac/ScanToMake.xcodeproj -scheme ScanToMake -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath "${{ runner.temp }}/mac-build" CODE_SIGNING_ALLOWED=NO build
      - name: Compiled model worker boundary tests
        run: STM_MAC_BUILT_APP="${{ runner.temp }}/mac-build/Build/Products/Debug/Scan to Make.app" node --test apps/mac/Tests/model-worker.test.mjs
