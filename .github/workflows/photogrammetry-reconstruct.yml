name: Photogrammetry reconstruct
on:
  push:
    paths: ['tools/photogrammetry-reconstruct/**', '.github/workflows/photogrammetry-reconstruct.yml']
  pull_request:
    paths: ['tools/photogrammetry-reconstruct/**', '.github/workflows/photogrammetry-reconstruct.yml']
permissions:
  contents: read
jobs:
  build-and-unit-test:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/photogrammetry-reconstruct
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      # No reconstruction: hosted virtual hardware is not a qualified GPU fixture.
