name: Companion checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/companion/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'tools/scan-repair/**'
      - 'services/project/**'
      - 'services/printer-handoff/**'
      - 'packages/contracts/**'
      - '.github/workflows/companion.yml'
  push:
    branches: [main]
    paths:
      - 'services/companion/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'tools/scan-repair/**'
      - 'services/project/**'
      - 'services/printer-handoff/**'
      - 'packages/contracts/**'
      - '.github/workflows/companion.yml'
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            services/project/package-lock.json
            services/printer-handoff/package-lock.json
            services/companion/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned USD runtime for capture-import tests
        run: |
          python -m pip install --disable-pip-version-check usd-core==26.8
          python -c "from pxr import Ar, Gf, Sdf, Usd, UsdGeom, UsdUtils"
          echo "CAPTURE_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Locate pinned Blender
        run: echo "BLENDER=${{ runner.temp }}/blender/blender-5.0.1-linux-x64/blender" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: blender-cache
        with:
          path: ${{ runner.temp }}/blender
          key: blender-5.0.1-linux-x64-8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
      - name: Download and verify Blender against published checksums
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/blender"
          cd "${{ runner.temp }}/blender"
          base=https://download.blender.org/release/Blender5.0
          curl --fail --location --retry 3 "$base/blender-5.0.1.sha256" -o checksums.txt
          curl --fail --location --retry 3 "$base/blender-5.0.1-linux-x64.tar.xz" -o blender-5.0.1-linux-x64.tar.xz
          awk '$2 == "blender-5.0.1-linux-x64.tar.xz" {print}' checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          test "$(cut -d ' ' -f 1 selected.sha256)" = 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
          sha256sum --check selected.sha256
          tar -xf blender-5.0.1-linux-x64.tar.xz
          rm blender-5.0.1-linux-x64.tar.xz
      - name: Install headless software-rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 xvfb
      - run: npm ci --prefix packages/contracts --ignore-scripts
      - run: npm ci --prefix services/project --ignore-scripts
      - run: npm ci --prefix services/printer-handoff --ignore-scripts
      - run: npm ci --prefix services/companion --ignore-scripts
      - run: npm test --prefix packages/contracts
      - run: xvfb-run -a npm test --prefix services/companion
