name: Companion checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/companion/**'
      - 'tools/templates/drawer-organizer/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'services/project/**'
      - 'packages/contracts/**'
      - '.github/workflows/companion.yml'
  push:
    branches: [main]
    paths:
      - 'services/companion/**'
      - 'tools/templates/drawer-organizer/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'services/project/**'
      - 'packages/contracts/**'
      - '.github/workflows/companion.yml'
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            services/project/package-lock.json
            services/companion/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned USD runtime for capture-import tests
        run: |
          python -m pip install --disable-pip-version-check usd-core==26.8
          python -c "from pxr import Ar, Gf, Sdf, Usd, UsdGeom, UsdUtils"
          echo "CAPTURE_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: npm ci --prefix packages/contracts --ignore-scripts
      - run: npm ci --prefix services/project --ignore-scripts
      - run: npm ci --prefix services/companion --ignore-scripts
      - run: npm test --prefix services/companion
