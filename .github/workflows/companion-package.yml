name: Companion package
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/companion/**'
      - 'services/companion/**'
      - 'services/project/**'
      - 'packages/contracts/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'tools/capture-fit-eval/**'
      - 'tools/scan-repair/**'
      - 'tools/scan-correct/**'
      - '.github/workflows/companion-package.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/companion/**'
      - 'services/companion/**'
      - 'services/project/**'
      - 'packages/contracts/**'
      - 'tools/capture-mesh-convert/**'
      - 'tools/capture-pipeline/**'
      - 'tools/capture-fit-eval/**'
      - 'tools/scan-repair/**'
      - 'tools/scan-correct/**'
      - '.github/workflows/companion-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check installer and launchd configuration on Linux
        run: |
          bash -n deploy/companion/install-macos.sh
          bash -n deploy/companion/download-blender.sh
          bash -n deploy/companion/smoke.sh
          python3 deploy/companion/test_macos.py -v
      - name: Build companion image
        run: docker build --platform linux/amd64 -t scan-to-make-companion:local -f deploy/companion/Dockerfile .
      - name: Container, auth, Blender and both MCP servers
        run: bash deploy/companion/smoke.sh
      - name: Validate Compose configuration
        run: |
          cp deploy/companion/companion.env.example deploy/companion/companion.env
          docker compose -f deploy/companion/compose.yaml config --quiet
