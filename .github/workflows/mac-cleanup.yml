name: Native Mac cleanup
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/scan-correct/**'
      - 'tools/scan-repair/**'
      - 'tools/capture-mesh-convert/**'
      - 'deploy/companion/**'
      - '.github/workflows/mac-cleanup.yml'
  push:
    branches: [main]
    paths:
      - 'tools/scan-correct/**'
      - 'tools/scan-repair/**'
      - 'tools/capture-mesh-convert/**'
      - 'deploy/companion/**'
      - '.github/workflows/mac-cleanup.yml'
permissions:
  contents: read
jobs:
  native-cleanup:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify installer and installed CLI on macOS
        run: |
          bash -n deploy/companion/install-macos.sh
          python deploy/companion/test_macos.py -v
      - name: Install pinned native Blender
        run: |
          test "$(uname -m)" = arm64
          bash deploy/companion/download-blender.sh "$RUNNER_TEMP/blender"
          echo "BLENDER=$RUNNER_TEMP/blender/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
      - name: Install capture and still codecs
        run: python -m pip install -r tools/capture-mesh-convert/requirements.txt -r tools/scan-correct/requirements.txt
      - name: Verify native isolation and full correction suite (no skips)
        run: |
          "$BLENDER" --version
          python - <<'PY'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tools/scan-correct/tests'))
          print('Skipped tests:', result.skipped)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
