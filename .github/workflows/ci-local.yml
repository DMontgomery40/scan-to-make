name: Local workflow runner checks
on:
  pull_request:
    branches: [main]
    # The trunk guard's tests also run every build/install script it guards.
    paths: ['scripts/**', '.github/workflows/**', 'apps/mac/scripts/**', 'apps/mobile/scripts/**', 'apps/linux/scripts/**',
            'tools/linux-host/prepare-payload.sh', 'tools/linux-reconstruct/packaging/**', 'android/scripts/**']
  push:
    branches: [main]
    # The trunk guard's tests also run every build/install script it guards.
    paths: ['scripts/**', '.github/workflows/**', 'apps/mac/scripts/**', 'apps/mobile/scripts/**', 'apps/linux/scripts/**',
            'tools/linux-host/prepare-payload.sh', 'tools/linux-reconstruct/packaging/**', 'android/scripts/**']
permissions:
  contents: read
jobs:
  ci-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-ci-local.txt
      - run: bash -n scripts/ci-local.sh
      - run: python -m unittest discover -s scripts/tests -v
      - run: scripts/ci-local.sh all --dry-run
