name: Template catalog checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/templates/**'
      - 'packages/contracts/fixtures/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'tools/templates/**'
      - 'packages/contracts/fixtures/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate catalog against template folders and code
        run: python tools/templates/_catalog/validate_catalog.py
      - name: Run catalog validator tests
        run: python -m unittest discover -s tools/templates/_catalog/tests -v
