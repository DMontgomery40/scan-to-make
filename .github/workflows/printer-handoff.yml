name: Printer handoff checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/printer-handoff/**'
      - '.github/workflows/printer-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'services/printer-handoff/**'
      - '.github/workflows/printer-handoff.yml'
permissions:
  contents: read
jobs:
  printer-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix services/printer-handoff --ignore-scripts
      - run: npm test --prefix services/printer-handoff
