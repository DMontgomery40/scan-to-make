name: Print tools checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/printability/**'
      - '.github/workflows/print-tools.yml'
  push:
    branches: [main]
    paths:
      - 'tools/printability/**'
      - '.github/workflows/print-tools.yml'
permissions:
  contents: read
jobs:
  print-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run printability tests (stdlib backend)
        run: python -m unittest discover -s tools/printability/tests -v
      - name: Install NumPy backend
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.*'
      - name: Run printability tests (NumPy backend)
        run: python -m unittest discover -s tools/printability/tests -v
