name: Mobile checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci --prefix packages/contracts --ignore-scripts
      - run: npm run build --prefix packages/contracts
      - run: npm ci --prefix apps/mobile --ignore-scripts
      - run: npm run typecheck --prefix apps/mobile
      - run: npm run lint --prefix apps/mobile
      - run: npm test --prefix apps/mobile -- --runInBand
