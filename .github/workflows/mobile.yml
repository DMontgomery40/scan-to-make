name: Mobile checks
# The iPhone and iPad app is pure Swift and SwiftUI (no React Native, Metro or node_modules), with its
# shared code in packages/CounterpartKit. Both are tested on macOS with Xcode.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/CounterpartKit/**'
      - 'packages/contracts/fixtures/**'
      - '.github/workflows/mobile.yml'
      - 'scripts/camera_safe_tests.py'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/CounterpartKit/**'
      - 'packages/contracts/fixtures/**'
      - '.github/workflows/mobile.yml'
      - 'scripts/camera_safe_tests.py'
permissions:
  contents: read
jobs:
  counterpartkit:
    name: CounterpartKit tests
    # GitHub's macOS 27 image with Xcode 27, as mac.yml uses.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        # The app targets iOS 27: GitHub's image with Xcode 27 keeps it at Xcode_27.2.app; a Mac running the local gate already has it selected.
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; fi
          case "$(xcodebuild -version)" in "Xcode 27.2"*) ;; *) echo "Xcode 27.2 is required"; exit 1 ;; esac
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test CounterpartKit on macOS (model, words, formatters, pairing, client)
        working-directory: packages/CounterpartKit
        run: |
          set -euo pipefail
          trap 'rm -rf "${{ runner.temp }}/counterpartkit"' EXIT
          xcodebuild test -scheme CounterpartKit -destination 'platform=macOS' -derivedDataPath "${{ runner.temp }}/counterpartkit"

  app:
    name: iPhone app build and tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        # The app targets iOS 27: GitHub's image with Xcode 27 keeps it at Xcode_27.2.app; a Mac running the local gate already has it selected.
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; fi
          case "$(xcodebuild -version)" in "Xcode 27.2"*) ;; *) echo "Xcode 27.2 is required"; exit 1 ;; esac
      - name: The committed Xcode project matches project.yml
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then echo "xcodegen not installed; skipping the drift check"; exit 0; fi
          cp -R ScanToMake.xcodeproj "${{ runner.temp }}/committed.xcodeproj"
          trap 'rm -rf "${{ runner.temp }}/committed.xcodeproj"' EXIT
          xcodegen generate --spec project.yml --quiet
          diff -r "${{ runner.temp }}/committed.xcodeproj" ScanToMake.xcodeproj
      - name: Find an iOS 27 simulator (iPhone 18 Pro when installed)
        run: |
          set -euo pipefail
          xcrun simctl list -j runtimes devicetypes > "${{ runner.temp }}/simctl.json"
          python3 - "${{ runner.temp }}/simctl.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          runtimes = [r for r in data["runtimes"] if r.get("isAvailable") and r["platform"] == "iOS" and r["version"].startswith("27.")]
          if not runtimes: sys.exit("::error::No iOS 27 simulator runtime is installed.")
          iphones = {t["identifier"]: t["name"] for t in data["devicetypes"] if t.get("productFamily") == "iPhone"}
          def choice(runtime):
              supported = [t["identifier"] for t in runtime.get("supportedDeviceTypes", []) if t["identifier"] in iphones]
              pro = [t for t in supported if iphones[t] == "iPhone 18 Pro"]
              return (bool(pro), [int(x) for x in runtime["version"].split(".")], (pro or supported or [None])[-1])
          runtime = max(runtimes, key=choice)
          kind = choice(runtime)[2]
          if not kind: sys.exit("::error::No iPhone simulator type for " + runtime["name"])
          preferred = [{"identifier": kind}]
          print("SIM_RUNTIME=" + runtime["identifier"]); print("SIM_TYPE=" + preferred[-1]["identifier"])
          # Every layout (PRD §6.1): the same build's layout tests also run at regular width on an iPad.
          ipads = {t["identifier"]: t["name"] for t in data["devicetypes"] if t.get("productFamily") == "iPad"}
          supported = [t["identifier"] for t in runtime.get("supportedDeviceTypes", []) if t["identifier"] in ipads]
          air = [t for t in supported if ipads[t].startswith("iPad Air 11")]
          if not supported: sys.exit("::error::No iPad simulator type for " + runtime["name"])
          print("IPAD_TYPE=" + (air or supported)[-1])
          PY
      - name: Unit and UI tests on an iOS 27 simulator (iPhone 18 Pro when installed), then the layout tests on an iPad
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl create "mobile-ci-${GITHUB_RUN_ID:-local}-$$" "$SIM_TYPE" "$SIM_RUNTIME")
          IPAD=$(xcrun simctl create "mobile-ci-ipad-${GITHUB_RUN_ID:-local}-$$" "$IPAD_TYPE" "$SIM_RUNTIME")
          trap 'for s in "$SIM" "$IPAD"; do xcrun simctl shutdown "$s" >/dev/null 2>&1 || true; xcrun simctl delete "$s" >/dev/null 2>&1 || true; done; rm -rf "${{ runner.temp }}/app-tests"' EXIT
          # Ad hoc signing gives the Simulator build its Keychain entitlement, as on a device.
          xcodebuild build-for-testing -project apps/mobile/ios/ScanToMake.xcodeproj -scheme ScanToMake \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath "${{ runner.temp }}/app-tests" \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
          manifests=("${{ runner.temp }}/app-tests/Build/Products/"*.xctestrun)
          test "${#manifests[@]}" = 1
          python3 scripts/camera_safe_tests.py "${manifests[0]}"
          # A test that hangs fails in minutes instead of holding the lane: on Nov 10 one waited 41 minutes on its first case.
          xcodebuild test-without-building -xctestrun "${manifests[0]}" \
            -destination "platform=iOS Simulator,id=$SIM" -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300
          # Regular width: the starters, the New button and search on the iPad layout (PRD §6.1).
          xcodebuild test-without-building -xctestrun "${manifests[0]}" \
            -destination "platform=iOS Simulator,id=$IPAD" -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -only-testing:ScanToMakeUITests/LayoutParityUITests \
            -only-testing:ScanToMakeUITests/ProjectScreensUITests/testSearchExplainsHiddenProjectsAndShowAllRestoresThem
      - name: Unsigned iPhoneOS Release build has no React Native in it
        run: |
          set -euo pipefail
          trap 'rm -rf "${{ runner.temp }}/app-release"' EXIT
          xcodebuild build -project apps/mobile/ios/ScanToMake.xcodeproj -scheme ScanToMake -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "${{ runner.temp }}/app-release" CODE_SIGNING_ALLOWED=NO
          APP="${{ runner.temp }}/app-release/Build/Products/Release-iphoneos/ScanToMake.app"
          test -x "$APP/ScanToMake"
          if find "$APP" \( -iname '*react*' -o -iname '*hermes*' -o -name '*.jsbundle' \) | grep .; then echo "React Native found in the bundle"; exit 1; fi
          if nm "$APP/ScanToMake" | grep -E ' _?RCT|facebook::react'; then echo "React Native symbols found"; exit 1; fi
          echo "No React Native: $(du -sh "$APP" | cut -f1) bundle"
