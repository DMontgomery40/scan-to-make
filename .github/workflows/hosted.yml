name: Hosted checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/hosted/**'
      - 'packages/contracts/**'
      - '.github/workflows/hosted.yml'
  push:
    branches: [main]
    paths:
      - 'services/hosted/**'
      - 'packages/contracts/**'
      - '.github/workflows/hosted.yml'
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            services/hosted/package-lock.json
      - run: npm ci --prefix packages/contracts --ignore-scripts
      - run: npm run build --prefix packages/contracts
      - run: npm ci --prefix services/hosted --ignore-scripts
      - run: npm test --prefix services/hosted
