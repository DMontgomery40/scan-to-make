<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Counterpart mark: an object (solid) and its counterpart (outline), overlapping.
       Single-colour geometry for embossing or inlaying on prints. 100 x 100 units; scale to size. -->
