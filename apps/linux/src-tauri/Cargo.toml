[package]
name = "counterpart"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "io-util", "time", "process", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
libc = "0.2"
url = "2"
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
