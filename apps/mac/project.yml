name: ScanToMake
options:
  bundleIdPrefix: com.scantomake
  deploymentTarget:
    macOS: '27.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3
  # The shared domain model and status words (KAN-217), so the Mac and the phone say the same thing.
  CounterpartKit:
    path: ../../packages/CounterpartKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: X7F5F9LR24
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    STM_VARIANT: ''
    STM_USE_LEGACY_COMPANION: YES
    SPARKLE_FEED_URL: ''
    # '+CloudKit' signs the app for iCloud (CloudKit and its pushes); it needs the team's provisioning profile.
    STM_ENTITLEMENTS_SUFFIX: ''
    STM_APS_ENVIRONMENT: development
    STM_MAC_PROVISIONING_PROFILE: ''
    SPARKLE_PUBLIC_KEY: ''
targets:
  AgentKit:
    type: framework
    platform: macOS
    sources: [AgentKit]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  ScanToMake:
    productName: Counterpart
    type: application
    platform: macOS
    sources: [App, ControlKit/Sources/ControlKit]
    dependencies:
      - target: AgentKit
      - package: Sparkle
      - package: CounterpartKit
    settings:
      PRODUCT_NAME: Counterpart
      PRODUCT_BUNDLE_IDENTIFIER: com.scantomake.mac$(STM_VARIANT)
      INFOPLIST_FILE: Config/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_ENTITLEMENTS: Config/App$(STM_ENTITLEMENTS_SUFFIX).entitlements
      PROVISIONING_PROFILE_SPECIFIER: $(STM_MAC_PROVISIONING_PROFILE)
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed companion and launch agent
        script: 'bash "$SRCROOT/scripts/embed.sh"'
        basedOnDependencyAnalysis: false
  AgentKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ['*.mjs']
      - AppTests
      - App/ModelAccessModel.swift
      - App/NearbyModel.swift
      - App/ObjectsModel.swift
      - App/MacStatusModel.swift
      - App/NotificationPrefs.swift
      - App/FusionSetup.swift
      - App/Diagnostics.swift
      - App/EventRelayPolicy.swift
      - App/PrinterUpdates.swift
      - App/PublishedModel.swift
      - App/BlenderBridge.swift
      - App/Files.swift
      - App/ModelMesh.swift
      - ControlKit/Sources/ControlKit
    dependencies:
      - target: AgentKit
      - package: CounterpartKit
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  ScanToMake:
    build:
      targets:
        ScanToMake: all
        AgentKitTests: [test]
    test:
      targets: [AgentKitTests]
